<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f6e27a"/>
      <stop offset="50%" stop-color="#d4a843"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="book1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5a2b"/><stop offset="100%" stop-color="#6d4423"/>
    </linearGradient>
    <linearGradient id="book2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e6b4f"/><stop offset="100%" stop-color="#15523c"/>
    </linearGradient>
    <linearGradient id="book3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a2e3a"/><stop offset="100%" stop-color="#5c2230"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="url(#gold)" stroke-width="4" opacity="0.5"/>
  <!-- shelf -->
  <rect x="86" y="332" width="340" height="26" rx="6" fill="#6b4a2e" filter="url(#shadow)"/>
  <rect x="86" y="332" width="340" height="8" rx="4" fill="#8b6239" opacity="0.7"/>
  <!-- books -->
  <g filter="url(#shadow)">
    <rect x="110" y="170" width="46" height="162" rx="4" fill="url(#book1)"/>
    <rect x="118" y="170" width="6" height="162" fill="#a06a35" opacity="0.5"/>
    <rect x="122" y="200" width="22" height="3" rx="1.5" fill="url(#gold)" opacity="0.8"/>
    <rect x="122" y="210" width="22" height="3" rx="1.5" fill="url(#gold)" opacity="0.5"/>
    <rect x="160" y="150" width="54" height="182" rx="4" fill="url(#book2)"/>
    <rect x="170" y="150" width="6" height="182" fill="#2a8563" opacity="0.5"/>
    <rect x="172" y="185" width="30" height="4" rx="2" fill="url(#gold)" opacity="0.8"/>
    <rect x="172" y="198" width="30" height="3" rx="1.5" fill="url(#gold)" opacity="0.5"/>
    <rect x="176" y="210" width="22" height="3" rx="1.5" fill="url(#gold)" opacity="0.4"/>
    <rect x="218" y="185" width="40" height="147" rx="4" fill="#2c4a7c"/>
    <rect x="225" y="185" width="5" height="147" fill="#3a5f99" opacity="0.5"/>
    <rect x="228" y="215" width="20" height="3" rx="1.5" fill="url(#gold)" opacity="0.7"/>
    <rect x="262" y="160" width="50" height="172" rx="4" fill="url(#book3)"/>
    <rect x="271" y="160" width="6" height="172" fill="#9a3a4a" opacity="0.5"/>
    <rect x="272" y="195" width="28" height="4" rx="2" fill="url(#gold)" opacity="0.8"/>
    <rect x="272" y="208" width="28" height="3" rx="1.5" fill="url(#gold)" opacity="0.5"/>
    <rect x="316" y="175" width="44" height="157" rx="4" fill="#5b3a7d"/>
    <rect x="324" y="175" width="5" height="157" fill="#7449a0" opacity="0.5"/>
    <rect x="326" y="205" width="24" height="3" rx="1.5" fill="url(#gold)" opacity="0.7"/>
    <rect x="364" y="190" width="38" height="142" rx="4" fill="#3d6b52"/>
    <rect x="371" y="190" width="5" height="142" fill="#4e8768" opacity="0.5"/>
    <rect x="373" y="218" width="20" height="3" rx="1.5" fill="url(#gold)" opacity="0.7"/>
  </g>
  <!-- open book accent -->
  <g transform="translate(256,380)" filter="url(#shadow)">
    <path d="M-52 0 Q-52 -18 -30 -18 L0 -10 L30 -18 Q52 -18 52 0 L52 28 Q52 36 44 36 L4 28 L0 28 L-4 28 L-44 36 Q-52 36 -52 28 Z" fill="#f5f0e6"/>
    <path d="M0 -10 L0 28" stroke="#d4c8b0" stroke-width="2"/>
    <path d="M-38 -4 L-8 -2" stroke="#c4b896" stroke-width="2" stroke-linecap="round"/>
    <path d="M-38 6 L-10 7" stroke="#c4b896" stroke-width="2" stroke-linecap="round"/>
    <path d="M-36 16 L-12 16" stroke="#c4b896" stroke-width="2" stroke-linecap="round"/>
    <path d="M8 -2 L38 -4" stroke="#c4b896" stroke-width="2" stroke-linecap="round"/>
    <path d="M10 7 L38 6" stroke="#c4b896" stroke-width="2" stroke-linecap="round"/>
    <path d="M12 16 L36 16" stroke="#c4b896" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="256" y="452" text-anchor="middle" font-family="Tahoma, Arial, sans-serif" font-size="50" font-weight="700" fill="url(#gold)">مكتبتي</text>
  <text x="256" y="486" text-anchor="middle" font-family="Tahoma, Arial, sans-serif" font-size="24" font-weight="600" fill="#f1d48a">دكتور يوسف مَعَنَّا</text>
</svg>
